[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pip-tools]
generate-hashes = true
no-annotate = true

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]

[project]
name = "ethstaker_kb"
description = "Ethstaker Knowledge Base"
readme = "README.md"
version = "2.0.0"
dependencies = [
  "zensical>=0.0.71"
]
requires-python = ">=3.11,<4"

[project.urls]
"Homepage" = "https://docs.ethstaker.org"
